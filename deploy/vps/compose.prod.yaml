name: chashka-coffee-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ${APP_DIR:?APP_DIR is required}
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ${UPLOADS_DIR:?UPLOADS_DIR is required}:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const response = await fetch(\"http://localhost:3000/health\"); process.exit(response.ok ? 0 : 1)'" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - default
      - proxy

  migrate:
    build:
      context: ${APP_DIR:?APP_DIR is required}
      dockerfile: backend/Dockerfile
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
    command: ["bun", "run", "prisma:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["maintenance"]

  website-build:
    image: oven/bun:1.3.14
    working_dir: /app
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL:?PUBLIC_WEBAPP_URL is required}
      PUBLIC_ROBOTS_DISALLOW: "false"
      PUBLIC_YANDEX_MAPS_API_KEY: ${PUBLIC_YANDEX_MAPS_API_KEY:-}
      PUBLIC_YANDEX_METRIKA_ID: ${PUBLIC_YANDEX_METRIKA_ID-}
      WEBSITE_RELEASES_DIR: /srv/website
      WEBSITE_BUILD_STAGING_DIR: /srv/website/.release-staging
    command: ["/bin/sh", "-ec", "bun install --frozen-lockfile && bun deploy/vps/scripts/build-website-release.mjs"]
    volumes:
      - ${APP_DIR:?APP_DIR is required}:/app
      - ${WEBSITE_RELEASES_DIR:?WEBSITE_RELEASES_DIR is required}:/srv/website
    profiles: ["build"]

  website-builder:
    image: oven/bun:1.3.14
    restart: unless-stopped
    working_dir: /app
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL:?PUBLIC_WEBAPP_URL is required}
      PUBLIC_ROBOTS_DISALLOW: "false"
      PUBLIC_YANDEX_MAPS_API_KEY: ${PUBLIC_YANDEX_MAPS_API_KEY:-}
      PUBLIC_YANDEX_METRIKA_ID: ${PUBLIC_YANDEX_METRIKA_ID-}
      WEBSITE_RELEASES_DIR: /srv/website
      WEBSITE_BUILD_STAGING_DIR: /srv/website/.release-staging
    command: ["/bin/sh", "-ec", "bun install --frozen-lockfile && bun run --cwd backend start:website-builder"]
    volumes:
      - ${APP_DIR:?APP_DIR is required}:/app
      - ${WEBSITE_RELEASES_DIR:?WEBSITE_RELEASES_DIR is required}:/srv/website
    depends_on:
      api:
        condition: service_healthy

  webapp-build:
    image: oven/bun:1.3.14
    working_dir: /app
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
      VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:?VITE_PUBLIC_SITE_URL is required}
    command: ["/bin/sh", "-ec", "bun install --frozen-lockfile && bun run build:webapp"]
    volumes:
      - ${APP_DIR:?APP_DIR is required}:/app
    profiles: ["build"]

volumes:
  postgres_data:

networks:
  proxy:
    external: true
    name: chashka-coffee-proxy
